#### Matrix Конфигурация - checks.yml ###############################################
#
#     Привет, добро пожаловать в Matrix античит. Это checks.yml, используемый
#  для определения настроек и поведения каждой проверки. Здесь вы можете
#  настроить параметры каждой проверки и определить действия после обнаружения
#  читерства игрока.
#
#  ВНИМАНИЕ! При обнаружении ложных срабатываний и обходов сначала
#  рассмотрите возможность сообщить об ошибке. Изменение файла конфигурации
#  не решит проблему ложных срабатываний и обходов!
#
#  - Что такое "VL"?
#        "VL" — это сокращение от "Violation Level" (уровень нарушений).
#    Когда игрок помечается античитом как читер, его уровень нарушений
#    увеличивается. Когда VL игрока достигает значения в узле "commands",
#    выполняется соответствующая команда.
#
#  - При возникновении проблем обратитесь в наш официальный Discord:
#    https://discord.gg/pEvY55J
#
#  Спасибо за использование Matrix античита!
#
#####################################################################################

## KillAura
# Предотвращает использование игроком хаков KillAura/AimBot
killaura:
  # Включить проверку KillAura?
  enable: true

  # Список различных модулей проверки KillAura в Matrix
  modules:
    # Проверяет, проявляет ли игрок аномальное поведение в бою
    flaw:
      type_a:
        enable: true
        vl: 3
      type_b:
        enable: true
        vl: 10
      type_c:
        enable: true
        vl: 10
      type_d:
        enable: true
        vl: 10
      type_e:
        enable: true
        vl: 5
    # Проверяет, правильно ли направлен взгляд игрока при атаке
    rotation:
      type_a:
        enable: true
        vl: 2
      type_b:
        enable: true
        vl: 2
    # Проверяет, проявляет ли игрок характеристики прицеливания, похожие на аимбот
    aimbot:
      vl_weight: 7
      cancel_hit: true

      check_aimbot_sync: true
      check_aimbot_shake: true
      check_aimbot_snap: true
      check_aimbot_sensitivity: true
      check_aimbot_acceleration: true
      check_aimbot_bad_rotation: true

    crystal:
      enable: true
      vl_weight: 5
      cancel_attack: true

    # NPC-проверка KillAura. Создаёт фейкового игрока позади проверяемого для
    # обнаружения KillAura. Не волнуйтесь, игрок видит только своего NPC
    npc:
      enable: true
      vl_weight: 5

      # Выполнять расчёт позиции NPC асинхронно? (может потреблять ресурсы)
      async: true

      # Должны ли NPC использовать реальные ID сущностей вместо случайных?
      # Некоторые чит-клиенты могут обходить случайные ID сущностей
      real_entity_id: true

      # NPC появляется только когда игрок атакует других игроков?
      # Если true, NPC генерируется только при атаке на других игроков
      spawn_on_attack_player: true

      # NPC генерируется только по команде? Если false, NPC создаётся
      # автоматически во время боя. Если true, NPC можно создать только
      # через команду "matrix npc". (по умолчанию: true)
      only_command_trigger: true

      # Должен ли игрок видеть этого NPC? (true = видимый)
      visible: true

      # Принудительно использовать случайное имя (по умолчанию: false)
      # Если включено, NPC, созданный Matrix, будет использовать случайное имя
      # вместо имени онлайн-игрока. Это решает проблему обхода NPC с
      # "дублирующимися" именами. Однако Matrix НЕ будет применять команды
      # к NPC со случайным именем. Возможно, потребуется настроить это через API.
      # В противном случае некоторые клиенты обходят проверку по наличию цвета в имени NPC
      force_random_name: false

      # Настройка времени существования NPC (тики)
      check_ticks:
        base: 100
        attack_add: 20
        hit_bot_add: 50

      # Настройки движения NPC
      movement:
        distance_base: 3.2
        distance_random_size: 0.75
        distance_attack_base: 3.0
        move_up_after_attack: false
        max_speed: 0.5

    # Проверка критического удара. Предотвращает аномальные критические атаки
    critical:
      # Включить этот модуль?
      enable: true

      # Сколько VL получает игрок при обнаружении этим модулем?
      vl_weight: 5

      # Отменить атаку игрока после обнаружения читерства?
      cancel_attack: true

    # Проверка стрейфа
    strafe:
      enable: true
      vl_weight: 3
      cancel_move: true

    # Комбинированная проверка
    combine:
      aimbot_with_reach:
        time: 5000
        condition:
          - 'ka.abt.magic'
          - 'hb.reach'
          - 'hb.reach'
        action: 5 # +5 VL

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 5

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix npc %player% 100'
    20: 'matrix notify %player% возможно использует боевые читы (KillAura)'
    35: 'matrix notify %player% использует боевые читы (KillAura) #2'
    45: 'matrix delay 5 matrix kick %player% KillAura'

## HitBox
# Предотвращает использование хаков HitBox, Angle, Reach
hitbox:
  # Включить проверку HitBox?
  enable: true

  # Максимальная дистанция атаки (по умолчанию: 3.15)
  max_reach: 3.15

  # Длина трассировки назад в тиках при расчёте хитбокса
  trace_back_length: 8

  # Matrix должен точно отслеживать цель? (по умолчанию: false)
  # Примечание: эта опция может увеличить использование полосы пропускания
  strict_mode: true

  # Matrix должен проверять рейкаст? (требуется строгий режим)
  raycast: false

  # Matrix должен отменить атаку игрока после обнаружения читерства?
  # Доступные варианты:
  #  1. none   - ничего не делать
  #  2. silent - установить урон в ноль (рекомендуется)
  #  3. cancel - отменить атаку
  cancel_way: cancel

  # Количество нарушений для отмены незаконных ударов
  cancel_vl: 5

  # Веса нарушений
  vl_weights:
    miss_player_hitbox: 2
    reach_target_standing: 10
    reach_target_moving: 3

  # Включить динамический вес VL?
  # Если включено, вес VL будет рассчитываться на основе дистанции атаки игрока
  # Пример: 1vl при дистанции 3.2, 19vl при дистанции 5.0
  # При включении "reach_target_standing" и "reach_target_moving" перестанут действовать
  # Примечание: динамический VL = (текущая_дистанция - макс_дистанция) * множитель
  dynamic_vl:
    enable: true
    expander: 10
    min_vl: 3
    max_vl: 8

  # Максимальное увеличение VL за короткое время?
  # Из-за нестабильности сетевого соединения проверка HitBox может вызывать
  # ложные срабатывания при лаг-спайках. Эта опция ограничивает
  # максимальное увеличение VL за "5 секунд"
  max_burst_vl: 15

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 5

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix notify %player% попытался атаковать сущность за пределами максимальной дистанции (HitBox)'
    12: 'matrix npc %player% 120'
    15: 'matrix notify %player% попытался атаковать сущность за пределами максимальной дистанции (HitBox) #2'
    24: 'matrix kick %player% Reach/HitBox читы'

## Click (Проверка кликов)
# Предотвращает слишком быстрое нажатие или использование автокликеров
click:
  # Включить эту проверку?
  enable: true

  # Максимальный CPS игрока? При превышении этого значения будет обнаружено
  max_cps: 15

  # Модули
  check_cps: true
  check_swing: true
  check_timing: true

  # При обнаружении слишком высокого CPS динамически корректировать вес VL в зависимости от CPS?
  # Чем выше CPS игрока, тем выше VL при обнаружении читерства
  dynamic_cps_vl_weight: true

  # Размер буфера интервала кликов (не изменяйте!!!)
  buffer_size: 20

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 5

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix notify %player% попытался аномально кликать (Click) #1'
    18: 'matrix notify %player% попытался аномально кликать (Click) #2'
    30: 'matrix kick %player% Аномальные клики'

## Move (Проверка скорости движения)
# Предотвращает аномальное движение игрока
move:
  # Включить эту проверку?
  enable: true

  # Matrix должен блокировать чит NoSlow?
  check_noslow: true

  # Matrix должен обнаруживать подмену земли/отсутствие урона от падения?
  check_nofall: true

  # Когда игрок достигнет этого VL, начнётся откат аномального движения
  cancel_vl: 35

  # Matrix должен наносить урон игроку при откате?
  apply_damage: true

  # Matrix должен разрешить игроку стоять на отменённом блоке?
  # Не рекомендуется включать — незначительно влияет на производительность и может вызвать обходы
  # https://www.youtube.com/watch?v=9lNXNW6Phk0&t=133s
  allow_bpe_bridge: false

  # Matrix должен проверять скорость игроков с возможностью полёта?
  # Это может ограничить возможность полёта некоторых "PvP-клиентов"
  check_flying_players: false

  # Проверять, использует ли игрок инвентарь во время движения
  check_inventory_move: true

  # Matrix должен телепортировать игрока в пустоту, если он читерит в пустоте?
  allow_setback_to_void: true

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 10
    amount: 45

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    55: 'matrix notify %player% попытался аномально двигаться (Move) #1'
    90: 'matrix notify %player% попытался аномально двигаться (Move) #2'
    320: 'matrix kick %player% Аномальное движение'

## BadPackets (Аномальные пакеты)
# Предотвращает отправку игроком слишком большого количества пакетов или незаконных пакетов
badpackets:
  # Включить эту проверку?
  enable: true

  # Matrix должен блокировать размещение блоков в воздухе?
  # Игрок должен прилегать к другому блоку для размещения, иначе будет обнаружен
  # Некоторые моды схем, такие как Litematica, имеют эту функцию,
  # поэтому можно отключить при разрешённом использовании модов схем
  check_air_place: true

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 25

  # Когда игрок достигнет этого VL, начнётся откат таймера
  cancel_vl: 3

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    100: 'matrix notify %player% отправляет необычные пакеты серверу (BadPackets) #1'
    150: 'matrix notify %player% отправляет необычные пакеты серверу (BadPackets) #2'
    240: 'matrix kick %player% Отправка необычных пакетов'

## Delay (Проверка задержки)
# Предотвращает ускорение определённых действий, таких как быстрое поедание или лечение
delay:
  # Включить эту проверку?
  enable: true

  # Matrix должен блокировать действия игрока при обнаружении читерства?
  cancel_action: true

  # Список модулей
  # Вы можете определить вес VL каждого модуля. -1 для отключения
  check_healing: 1
  check_using_items: 1
  check_using_bow: 1
  check_auto_splash: 2
  check_inventory_action: 1
  check_auto_totem: 1
  check_auto_crossbow: 1
  check_fast_throw: 1

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 2

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    3: 'matrix notify %player% пытается ускорить действия (Delay) #1'
    5: 'matrix notify %player% пытается ускорить действия (Delay) #2'
    10: 'matrix kick %player% Ускорение действий'

## Block (Проверка блоков)
# Предотвращает быстрое разрушение или размещение блоков
block:
  # Включить эту проверку?
  enable: true

  # Количество нарушений для отмены незаконного разрушения/размещения (-1 = никогда не отменять)
  cancel_vl: 5

  # Список модулей
  # Здесь можно отключить отдельные модули
  modules:
    # Обнаруживает быстрое разрушение блоков
    fastbreak:
      enable: true
      vl_weight: 4
    # Обнаруживает быстрое размещение блоков
    fastplace:
      enable: true
      vl_weight: 1
      max_place_per_second: 9
    # Обнаруживает размещение блоков без взмаха рукой
    noswing:
      enable: true
      vl_weight: 1
    # Обнаруживает отсутствие пакета прерывания разрушения
    abort:
      enable: true
      vl_weight: 0

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 8

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix notify %player% попытался слишком быстро разместить/разрушить блок (FastPlace/FastBreak)'
    20: 'matrix kick %player% Читы FastPlace/FastBreak'

## Scaffold (Проверка скаффолда)
# Предотвращает слишком быстрое строительство мостов или башен
scaffold:
  # Включить эту проверку?
  enable: true

  # VL отмены
  cancel_vl: 15

  # Модули
  modules:
    # Обнаруживает быстрое строительство мостов
    place:
      enable: true
      vl_weight: 7
      check_jump: true

    # Предотвращает слишком быстрое строительство мостов
    delay:
      enable: true
      vl_weight: 5
      cancel_place: true
      min_delay: 6
      min_delay_diagonal: 3

    # Предотвращает слишком быстрый правый клик
    right_cps:
      enable: true
      vl_weight: 5
      max_cps: 29

    # Обнаруживает быстрое строительство башен
    tower:
      enable: true
      vl_weight: 2

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 6

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix notify %player% попытался быстро строить мост (Scaffold)'
    15: 'matrix notify %player% попытался быстро строить мост (Scaffold) #2'
    24: 'matrix kick %player% Scaffold/Tower'

## Jesus (Проверка хождения по воде)
# Предотвращает слишком быстрое движение в жидкости или хождение по ней
jesus:
  # Включить эту проверку?
  enable: true

  # Количество нарушений для отмены незаконных движений (-1 = никогда не отменять)
  cancel_vl: 15

  # Matrix должен игнорировать, плавает ли игрок?
  # Эта функция может предотвратить рассинхронизацию состояния плавания
  ignore_swim_pose: false

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 10
    amount: 10

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    20: 'matrix notify %player% попытался незаконно двигаться в жидкости (Jesus)'
    40: 'matrix notify %player% попытался незаконно двигаться в жидкости (Jesus) #2'
    50: 'matrix kick %player% Читы Jesus/WaterSpeed/WaterFly'

## Velocity (Проверка отбрасывания)
# Предотвращает использование хаков анти-отбрасывания
velocity:
  # Включить эту проверку?
  enable: true

  # Время ожидания ответа игрока на velocity (тики)
  # Если игрок не ответит после этого времени, он будет обнаружен
  wait_time: 20

  # Игнорировать игроков с лагом. Эта функция может игнорировать
  # игроков с лагом или переключающих ресурс-пак
  ignore_lag: true

  # Вес VL модулей проверки velocity (-1 = отключить)
  modules:
    respond: 5
    vertical: 1

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 3

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix notify %player% попытался игнорировать серверное velocity (Velocity)'
    15: 'matrix notify %player% попытался игнорировать серверное velocity (Velocity) #2'
    20: 'matrix kick %player% Velocity/Анти-отбрасывание'

## Spam (Проверка спама в чате)
# Предотвращает спам в чате сервера
chat:
  # Включить эту проверку?
  enable: true

  # Минимальное время между сообщениями (секунды)
  min_time: 3

  # Количество нарушений для отмены отправленных сообщений (-1 = никогда не отменять)
  cancel_vl: 3

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 30
    amount: 5

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    4: 'matrix notify %player% спамит в чате (ChatSpam)'
    10: 'matrix kick %player% Прекратите спамить в чате!'

## Interact (Проверка взаимодействия)
# Предотвращает незаконное взаимодействие с сущностями и блоками
interact:
  # Включить эту проверку?
  enable: true

  # Какую версию проверки взаимодействия использовать?
  # v1 = старая версия
  # v2 = новая версия (поддерживает только 1.8/1.12/1.19+)
  mode: "v1"

  # Matrix должен строже предотвращать аномальные взаимодействия? (по умолчанию: false)
  # Может вызывать ложные срабатывания, но предотвращает больше читов
  strict: false

  check_interact_block: true
  check_attack: true

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 10
    amount: 5

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix notify %player% попытался незаконно взаимодействовать с сущностью/блоком (Interact)'
    15: 'matrix kick %player% Незаконное взаимодействие с блоком/сущностью'

## Phase (Проверка прохождения сквозь блоки)
# Предотвращает прохождение игроков сквозь блоки
phase:
  # Включить эту проверку?
  enable: false

  # Как долго Matrix должен предотвращать движение игрока, если
  # он часто пытается проходить сквозь блоки? (миллисекунды)
  freeze_time: 400

  # Количество нарушений для отмены незаконных движений
  cancel_vl: 5

  # Исключённые типы блоков
  exclude_types: []

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 10

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    7: 'matrix notify %player% проходит сквозь блоки (Phase)'
    13: 'matrix notify %player% проходит сквозь блоки (Phase) #2'

## AutoBot (Проверка автоматического бота)
# Предотвращает использование бот-модов, таких как Baritone
# ПРИМЕЧАНИЕ: Эта проверка работает только для премиум-пользователей
autobot:
  # Включить эту проверку?
  enable: true

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 2

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    5: 'matrix notify %player% подозревается в использовании автоматических ботов (AutoBot)'
    10: 'matrix notify %player% подозревается в использовании автоматических ботов (AutoBot) #2'
    15: 'matrix kick %player% Авто-бот'

## Elytra (Проверка элитр)
# Предотвращает использование Elytra+, ElytraFlight и т.д.
# Работает только для 1.9+
elytra:
  # Включить эту проверку?
  enable: true

  # Matrix должен принудительно откатывать явно читерящих игроков?
  # Даже если они не достигли cancel_vl (по умолчанию: true)
  force_setback: true

  # VL отката (-1 = никогда не откатывать)
  setback_vl: 5

  # VL снятия элитр
  # Если игрок достигнет этого VL, Matrix выведет его из состояния полёта (-1 = отключить)
  unequip_vl: 20

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 7

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    10: 'matrix notify %player% подозревается в использовании полёта на элитрах (Elytra)'
    20: 'matrix notify %player% подозревается в использовании полёта на элитрах (Elytra) #2'
    40: 'matrix kick %player% Полёт на элитрах'

## Vehicle (Проверка транспорта)
# Предотвращает использование VehicleFlight, VehicleSpeed, EntitySpeed и т.д.
# Работает только для 1.9+
vehicle:
  # Включить эту проверку?
  enable: true

  # Запретить игрокам использовать определённых существ в качестве транспорта
  # Все типы сущностей: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
  deny_entity_types_as_vehicle:
    - 'LLAMA'

  # Скорость транспорта / скорость сущности
  speed:
    # Включить этот модуль?
    enable: true

    # VL отката (-1 = отключить откат)
    setback_vl: 2

  # Полёт транспорта / полёт лодки
  flight:
    # Включить этот модуль?
    enable: true

    # VL отката (-1 = никогда не откатывать)
    setback_vl: 4

    # VL покидания транспорта (-1 = никогда не покидать)
    leave_vehicle: 10

  # Настраиваемый интервал снижения VL (секунды) и размер шага снижения
  decay:
    interval: 15
    amount: 5

  # Пороги нарушений
  # количество_нарушений: '<команда>'
  commands:
    5: 'matrix notify %player% подозревается в использовании читов на транспорте (Vehicle)'
    10: 'matrix notify %player% подозревается в использовании читов на транспорте (Vehicle) #2'
    17: 'matrix kick %player% Подозрительное движение транспорта'
