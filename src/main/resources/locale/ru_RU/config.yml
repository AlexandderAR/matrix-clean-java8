#### Matrix Конфигурация - config.yml ###############################################
#
#     Привет, добро пожаловать в Matrix античит. Это config.yml, используемый
#  для определения глобальных настроек Matrix.
#
#  - При возникновении проблем обратитесь в наш официальный Discord:
#    https://discord.gg/pEvY55J
#
#  Полезные ссылки:
#    Website: https://matrix.rip
#    Discord: https://discord.gg/pEvY55J
#    Wiki: https://wiki.matrix.rip
#    Issue Tracker: https://github.com/jiangdashao/Matrix-Issues/issues
#
#  Спасибо за использование Matrix античита!
#
#####################################################################################

# Офлайн-режим плана
# При включении Matrix пропускает все запросы проверки лицензии и работает
# с полным набором функций Enterprise без обращения к серверу лицензий.
offline-plan: true

# Проверять обновления при запуске?
check_update: true

# Введите токен доступа здесь. Получить можно на https://localhost/offline (Client - Token)
# НЕ делитесь своим токеном доступа ни с кем!
# Если вы скачали плагин с PluginCloud, вводить вручную не нужно
# access_token: ''

# Интервал обновления кеша разрешений (единица: секунды, по умолчанию: 15)
permission_refresh_interval: 15

# Включить поддержку BungeeCord GeyserMC?
# Matrix поддерживает два способа запуска GeyserMC:
#   1. Режим Spigot: установите GeyserMC/FloodGate в Spigot. Изменять эту настройку не нужно, Matrix поддержит автоматически
#   2. Режим Bungee: когда GeyserMC установлен в BungeeCord, нужно включить эту опцию и также установить Matrix в BungeeCord
# !!!    НЕ включайте эту опцию, если GeyserMC НЕ установлен в BungeeCord
bungee_geysermc_support: false

# Показывать визуальный эффект молнии при кике через /matrix kick?
kick_strike_lightning: true

# Discord Webhook
discord_webhook:
  # Включить Discord Webhook
  enable: false

  # URL Webhook
  url: ''

# Защита от лага сервера
# Автоматически отключает некоторые проверки при лаге сервера.
# Это предотвращает большинство, но не все, ложные срабатывания.
tps_protection:
  # Включить эту функцию?
  enable: true

  # Минимальный TPS для срабатывания защиты
  min_tps: 17.0

  # Порог лаг-спайка (миллисекунды)
  # Если сервер не отвечает в течение определённого времени, проверки будут отключены
  lag_threshold: 1000

# Логирование нарушений (по умолчанию: true)
# Записывает все нарушения в файл. Файлы находятся в /plugins/Matrix/logs
# Предупреждение: при использовании BungeeCord рекомендуется установить FALSE.
# Это предотвратит хранение бесполезных лог-файлов и экономит дисковое пространство.
log_file: true

# Удаление устаревших лог-файлов (дни)
# Если лог-файл хранится больше указанного количества дней, он будет удалён
# Установите -1 для отключения этой функции
delete_time: 30

# Запретить разрешение обхода (по умолчанию: false)
# При установке TRUE Matrix будет проверять всех на сервере,
# ВКЛЮЧАЯ игроков со статусом оператора. При установке TRUE
# вы можете проводить необходимые тесты без удаления статуса оператора.
disable_bypass_permission: false

## Время повторного входа
# Через какое время после кика игрок может снова войти? (секунды)
# Установите -1 для отключения этой функции
relog_time: 5

# Защита от индикатора здоровья
# Если включено, Matrix изменит значение здоровья игрока, отправляемое
# клиенту, предотвращая просмотр здоровья других игроков через моды.
anti-health-indicator: true

# Обфускация пинга
# Если включено, Matrix установит пинг игрока (только в TAB-списке) в 0.
# Это может запутать функции антибота некоторых чит-клиентов
# и заставить их считать всех игроков ботами.
ping-obfuscation: true

# Отключённые компоненты
# Здесь можно отключить конкретную суб-проверку вместо отключения всей проверки.
# Имя компонента можно найти в конце verbose-сообщений.
# Пример: добавление "speed.web" отключит проверку быстрой паутины
disabled_components:
  - 'example entry'

# Пользовательский вес VL (формат: компонент: новый вес VL)
custom_vl_weight:
  - 'example_component:5'
