#### Matrix Конфигурация - language.yml #############################################
#
#     Привет, добро пожаловать в Matrix античит. Это language.yml,
#  используемый для определения языка отображения античита. Здесь вы можете
#  настроить, какие сообщения отображает античит.
#
#  - При возникновении проблем обратитесь в наш официальный Discord:
#    https://discord.gg/pEvY55J
#
#  Спасибо за использование Matrix античита!
#
#####################################################################################

# Определите префикс сообщений
prefix: '&7[&bMatrix&7]&r '

# Определите сообщение объявления после кика игрока античитом
kick-format: 'Игрок %player% был кикнут за читерство!'

# Определите формат подробных сообщений
verbose-format: '&7%player% не прошёл проверку &2%check% &8| &7%message%(%tooltips%) &8| &7vl:%vl%&b(+%add_vl%) &7ping:%ping% tps:%tps% component: %component% ver: %version%'

# Matrix должен транслировать сообщение при кике игрока?
kick-broadcast: true

# Какое сообщение отправить игроку, когда Matrix обнаруживает
# слишком быструю отправку сообщений в чате?
spam-warning: 'Вы не можете писать так быстро или отправлять одинаковый контент повторно!'

# Определяет сообщение блокировки при попытке быстрого
# переподключения к серверу после кика античитом
relog-message: 'Пожалуйста, подождите %time_left% секунд перед повторным входом!'

# Глобальные заполнители. Здесь можно определить константы для использования в checks.yml
#
#  Например, определите:
#     kick_help: "Если вы считаете это ложным срабатыванием, обратитесь к модератору"
#  Затем используйте %gp_kick_help% в checks.yml — он автоматически заменится на этот текст
#
global_placeholder: { }

# Определите псевдонимы компонентов
component_alias: {}

# Определите описания команд
commands:
  verbose: 'Показать/скрыть подробные сообщения Matrix'
  notify: 'Отправить сообщение всем онлайн-сотрудникам'
  toggle-notify: 'Переключить вывод уведомлений'
  npc: 'Создать NPC для обнаружения KillAura позади игрока'
  kick: 'Кикнуть игрока'
  msg: 'Отправить предупреждающее сообщение игроку'
  gui: 'Открыть панель управления'
  violations: 'Открыть GUI нарушений'
  ping: 'Получить значение задержки игрока'
  cps: 'Мониторить данные CPS игрока'
  reload: 'Перезагрузить конфигурацию'
  lang: 'Переключить язык отображения'

gui:
  main:
    toggle-checks:
      name: '&aПереключить проверки'
      description: '&7Нажмите, чтобы открыть GUI проверок'
    show-violations:
      name: '&aПоказать нарушения'
      description: '&7Нажмите, чтобы открыть GUI нарушений'
    toggle-verbose:
      name: '&aПереключить подробности'
      description: '&7Нажмите, чтобы включить/выключить подробные сообщения'
    reload-matrix:
      name: '&cПерезагрузить Matrix'
      description: '&7Нажмите, чтобы перезагрузить плагин'
    server-status:
      name: '&bСтатус сервера'
    support-links:
      name: '&bСсылки поддержки'
    premium-user:
      name: '&bПремиум-пользователь'
    close-gui:
      name: '&cЗакрыть GUI'

misc:
  update:
    start-checking: 'Проверка обновлений...'
    updater: '§a> Matrix Updater:'
    has-update: '§cДоступно обновление Matrix: §f%latest%  §cТекущая версия: §2%current%'
    latest: '§aВы используете последнюю версию Matrix античита <3'
    download-link: '§cСсылка для скачивания'
  premium:
    pass: 'Верификация премиум-версии пройдена!'
    expire-time: 'Срок действия: %time%'
  reload:
    start-reload: 'Перезагрузка Matrix...'
    reloaded: 'Matrix перезагружен.'
